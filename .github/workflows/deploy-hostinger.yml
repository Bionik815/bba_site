name: Deploy to Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-hostinger.yml"
      - "wordpress/public_html/ops/**"
      - "wordpress/public_html/wp-content/mu-plugins/**"
      - "wordpress/public_html/wp-content/plugins/bw-*/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload app files
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PROTOCOL: ${{ secrets.HOSTINGER_PROTOCOL }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_DIR }}
        run: |
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USERNAME"
          test -n "$HOSTINGER_PASSWORD"
          test -n "$HOSTINGER_REMOTE_DIR"

          lftp -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" "${HOSTINGER_PROTOCOL:-sftp}://$HOSTINGER_HOST:${HOSTINGER_PORT:-22}" <<EOF
          set cmd:fail-exit yes
          set ssl:verify-certificate no
          set sftp:auto-confirm yes

          mirror -R \
            --verbose \
            --only-newer \
            --parallel=2 \
            --exclude-glob config.php \
            --exclude-glob config.local.php \
            --exclude ^runtime/ \
            wordpress/public_html/ops "$HOSTINGER_REMOTE_DIR/ops"

          mirror -R \
            --verbose \
            --only-newer \
            --parallel=2 \
            wordpress/public_html/wp-content/mu-plugins "$HOSTINGER_REMOTE_DIR/wp-content/mu-plugins"

          mirror -R \
            --verbose \
            --only-newer \
            --parallel=2 \
            wordpress/public_html/wp-content/plugins/bw-gang-sheet-builder "$HOSTINGER_REMOTE_DIR/wp-content/plugins/bw-gang-sheet-builder"

          mirror -R \
            --verbose \
            --only-newer \
            --parallel=2 \
            wordpress/public_html/wp-content/plugins/bw-project-quote-tool "$HOSTINGER_REMOTE_DIR/wp-content/plugins/bw-project-quote-tool"

          mirror -R \
            --verbose \
            --only-newer \
            --parallel=2 \
            wordpress/public_html/wp-content/plugins/bw-player-packs "$HOSTINGER_REMOTE_DIR/wp-content/plugins/bw-player-packs"

          mirror -R \
            --verbose \
            --only-newer \
            --parallel=2 \
            wordpress/public_html/wp-content/plugins/bw-product-templates "$HOSTINGER_REMOTE_DIR/wp-content/plugins/bw-product-templates"

          mirror -R \
            --verbose \
            --only-newer \
            --parallel=2 \
            wordpress/public_html/wp-content/plugins/bw-client-codes-export "$HOSTINGER_REMOTE_DIR/wp-content/plugins/bw-client-codes-export"

          mirror -R \
            --verbose \
            --only-newer \
            --parallel=2 \
            wordpress/public_html/wp-content/plugins/bw-creator-store-builder "$HOSTINGER_REMOTE_DIR/wp-content/plugins/bw-creator-store-builder"

          mirror -R \
            --verbose \
            --only-newer \
            --parallel=2 \
            wordpress/public_html/wp-content/plugins/fm-surcharges "$HOSTINGER_REMOTE_DIR/wp-content/plugins/fm-surcharges"
          bye
          EOF
